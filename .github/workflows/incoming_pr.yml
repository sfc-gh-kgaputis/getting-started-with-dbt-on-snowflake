name: PR Validation
run-name: PR validation for ${{ github.actor }} — ${{ github.event.pull_request.title }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]

# Serialize updates and cleanup for the same PR while allowing different PRs to run concurrently.
concurrency:
  group: ci-${{ github.repository }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  run-ci-validation:
    if: github.event.action != 'closed'
    name: "CI: compile PR #${{ github.event.pull_request.number }}"
    runs-on: ubuntu-latest
    # No environment: declaration — the OIDC subject for pull_request events is:
    #   repo:<org>/<repo>:pull_request
    # which matches the github_actions_ci_user WORKLOAD_IDENTITY SUBJECT in Snowflake.
    env:
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      CI_PROJECT_NAME: tasty_bytes_dbt_ci_pr_${{ github.event.pull_request.number }}
      CI_SCHEMA: DBT_CI_PR_${{ github.event.pull_request.number }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v2
        with:
          use-oidc: true
          cli-version: "3.23.0"

      - name: Check Snowflake CLI version
        run: snow --version

      # Verify the OIDC token resolves to the expected service user
      - name: Test Snowflake connection
        run: snow connection test -x

      # Each PR gets its own project object so multiple PR validations can run concurrently.
      - name: Deploy PR-specific CI dbt project object
        run: |
          snow dbt deploy "${CI_PROJECT_NAME}" \
            --source ./tasty_bytes_dbt_demo \
            --default-target ci \
            --default-env ci \
            --dbt-version 1.10.15 \
            --force -x

      - name: List dbt project objects
        run: snow dbt list -x

      # Compile validates parsing, Jinja, refs, and generated SQL without materializing models.
      # The schema override makes this workflow ready for a future switch from compile to build.
      - name: Compile dbt project (CI target)
        run: |
          snow dbt execute -x \
            --env ci \
            --env-vars "{\"DBT_SCHEMA\":\"${CI_SCHEMA}\"}" \
            "${CI_PROJECT_NAME}" compile --target ci

  cleanup-ci-environment:
    if: github.event.action == 'closed'
    name: "CI: clean up PR #${{ github.event.pull_request.number }}"
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      CI_PROJECT_NAME: tasty_bytes_dbt_ci_pr_${{ github.event.pull_request.number }}
      CI_SCHEMA: DBT_CI_PR_${{ github.event.pull_request.number }}

    steps:
      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v2
        with:
          use-oidc: true
          cli-version: "3.23.0"

      - name: Test Snowflake connection
        run: snow connection test -x

      - name: Drop PR-specific dbt project object
        run: snow dbt drop -x --if-exists "${CI_PROJECT_NAME}"

      # Compile-only CI does not create this schema, but cleanup is ready for future build runs.
      - name: Drop PR-specific CI schema
        run: snow sql -q "DROP SCHEMA IF EXISTS ${SNOWFLAKE_DATABASE}.${CI_SCHEMA} CASCADE" -x
