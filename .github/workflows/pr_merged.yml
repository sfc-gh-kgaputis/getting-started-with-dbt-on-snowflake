name: Integration Deployment
run-name: Integration deployment triggered by ${{ github.actor }}
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  run-integration-deployment:
    name: "Integration: deploy and build on merge to main"
    runs-on: ubuntu-latest
    # No environment: declaration — the OIDC subject for push-to-main events is:
    #   repo:<org>/<repo>:ref:refs/heads/main
    # which matches the github_actions_integration_user WORKLOAD_IDENTITY SUBJECT in Snowflake.
    env:
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v2
        with:
          use-oidc: true
          cli-version: "3.23.0"

      - name: Check Snowflake CLI version
        run: snow --version

      # Verify the OIDC token resolves to the expected service user
      - name: Test Snowflake connection
        run: snow connection test -x

      # Deploy a stable integration dbt project object updated on every merge.
      # --force creates or updates the object if it already exists.
      - name: Deploy integration dbt project object
        run: snow dbt deploy tasty_bytes_dbt_integration --source ./tasty_bytes_dbt_demo --default-target integration --default-env integration --dbt-version 1.10.15 --force -x

      - name: List dbt project objects
        run: snow dbt list -x

      # Build all models and run all tests using the integration target.
      # Integration target materializes into TASTY_BYTES_DBT_DB.DEV.
      - name: Build and test dbt project (integration target)
        run: snow dbt execute -x tasty_bytes_dbt_integration build --target integration

      # (optional) Uncomment to manage integration Task orchestration via source control:
      # - name: Apply integration schedules
      #   run: snow sql -f ${{ github.workspace }}/tasty_bytes_dbt_demo/schedules_integration.sql -x
