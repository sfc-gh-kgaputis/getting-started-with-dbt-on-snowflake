env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        DBT_SCHEMA: "{{ select 'DBT_DEV_' || REGEXP_REPLACE(SPLIT_PART(CURRENT_USER(), '@', 1), '[^A-Za-z0-9_]', '_') }}"
    - name: ci
      env:
        DBT_SCHEMA: ci
    - name: integration
      env:
        DBT_SCHEMA: dev
    - name: prod
      env:
        DBT_SCHEMA: prod
